<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login Page</title>
    </head>
    <body>
        <header>
            <nav class="navbar">
                <div class="logo">
                    <a href="index.html"><img src="https://placehold.co/200x80?text=ShopLogo"
                        alt="shop logo" 
                        class="shop-logo"/>
                    </a>
                </div>
            </nav>
        </header>

        <!-- creating login form  -->
         <div class="form-container">
            <form class="login-form">
                <h2>Welcome Back!</h2>
                <div class="form-group">
                    <label for="username"><b>Mobile number : </b></label>
                    <input type="number" id="mobile-number" name="mobile-number" required 
                    placeholder="enter your mobile number">  
                </div>

                <button type="submit" onclick="redirectToOTPregister()">login</button>
                <p>New to our restaurant? <a href="signup.html">signup</a></p>

                <!-- Javascipt functionality  -->
                <script>
                    function redirectToOTPregister(){
                        window.location.href = "otpregister.html";
                    }
                </script>
            </form>

         </div>
    </body>
</html>
